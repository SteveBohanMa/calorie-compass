<!-- Round variant of icon.svg (source for the PNG launcher icons of Android 7.x; Android 8+ uses the
     vector drawables in ../res). The bolt is the in-app brand mark (src/screens/HomeScreen.tsx). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E9C76"/>
      <stop offset="1" stop-color="#123C31"/>
    </linearGradient>
  </defs>
  <circle cx="54" cy="54" r="54" fill="url(#bg)"/>
  <g transform="translate(21.6 21.6) scale(2.7)">
    <path d="M14.2 2 L5 13.6 H11 L9.8 22 L19 10.2 H13 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</svg>
